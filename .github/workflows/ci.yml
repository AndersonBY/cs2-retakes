name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Test and build
        run: |
          dotnet test tests/RetakesPlugin.Tests/RetakesPlugin.Tests.csproj -c Release --nologo
      - name: Build and validate release archive
        run: scripts/package-release.sh v3.1.1-mbsifu.0
      - uses: actions/upload-artifact@v7
        with:
          name: cs2-retakes-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
